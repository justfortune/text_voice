<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нокс Студия</title>
<!-- NOX_STUDIO 2026-11-11i · интерфейс «Нокс Студии»; сервер — nox_studio.py. Без внешних библиотек: работает без сети. -->
<style>
:root{
  --paper:#E8ECEA; --sheet:#FBFCFA; --ink:#17202A; --ink2:#5B6875; --rule:#CBD3CF; --tape:#DCE2DF;
  --blue:#1F5FBF; --red:#C8352B; --stamp:#0E6B5C; --text:#2A343E; --hover:#EEF2F0; --now:#F3F0DC;
  --sfx:#A8660F; --amb:#3E6C8C; --mus:#7347A8;
  --ui:"Bahnschrift","Segoe UI",system-ui,sans-serif; --serif:Cambria,"Sitka Text",Georgia,"PT Serif",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#14191D; --sheet:#1B2228; --ink:#E7EBEE; --ink2:#93A0AB; --rule:#2E3840; --tape:#10151A;
  --blue:#6EA8FF; --red:#FF7A6B; --stamp:#4CC9B0; --text:#CDD5DB; --hover:#222B32; --now:#2B2E22;
  --sfx:#E0A75A; --amb:#7FB0D4; --mus:#B598E6; } }
:root[data-theme="dark"]{
  --paper:#14191D; --sheet:#1B2228; --ink:#E7EBEE; --ink2:#93A0AB; --rule:#2E3840; --tape:#10151A;
  --blue:#6EA8FF; --red:#FF7A6B; --stamp:#4CC9B0; --text:#CDD5DB; --hover:#222B32; --now:#2B2E22;
  --sfx:#E0A75A; --amb:#7FB0D4; --mus:#B598E6; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.4 var(--ui);display:grid;grid-template-rows:auto auto auto 1fr auto;grid-template-columns:minmax(0,1fr);overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:1px solid var(--rule);border-radius:3px;padding:5px 11px;cursor:pointer}
button:hover{background:var(--hover)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,#sheet:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button.pri{background:var(--blue);border-color:var(--blue);color:var(--sheet);font-weight:600}
button.pri:hover{filter:brightness(1.08)}
button.lockb{border-color:var(--stamp);color:var(--stamp);font-weight:600}
button.lockb.on{background:var(--stamp);color:var(--sheet)}
button.ghost{border-color:transparent;padding:5px 7px}
.num{font-variant-numeric:tabular-nums;font-stretch:88%}

/* верхняя полоса */
#top{display:flex;align-items:center;gap:18px;padding:8px 16px;border-bottom:1px solid var(--rule);background:var(--sheet)}
#top .brand{font-weight:700;font-size:15px;letter-spacing:.01em;white-space:nowrap}
#top .brand small{font-weight:400;color:var(--ink2);margin-left:8px}
.partnav{display:flex;align-items:center;gap:4px}
.partnav #partBtn{font-weight:700;min-width:104px}
#partInfo{color:var(--ink2);margin-left:10px;white-space:nowrap}
#top nav{margin-left:auto;display:flex;gap:6px}
#engine{display:flex;align-items:center;gap:7px;white-space:nowrap}
#engine i{width:9px;height:9px;border-radius:50%;background:var(--ink2);display:inline-block}
#engine.ok i{background:var(--stamp)} #engine.wait i{background:var(--blue);animation:pulse 1.2s infinite} #engine.bad i{background:var(--red)}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){ #engine.wait i{animation:none} }

/* транспорт */
#transport{display:flex;align-items:center;gap:10px;padding:7px 16px;border-bottom:1px solid var(--rule)}
#play{width:44px;height:34px;padding:0;display:grid;place-items:center;background:var(--ink);border-color:var(--ink);color:var(--sheet)}
#play:hover{background:var(--ink);filter:brightness(1.25)}
#clock{font-size:20px;font-weight:600;min-width:150px}
#clock span{color:var(--ink2);font-weight:400;font-size:15px}
#transport .sep{width:1px;height:22px;background:var(--rule);margin:0 4px}
#transport .right{margin-left:auto;display:flex;gap:8px;align-items:center}
#zoomv{color:var(--ink2);min-width:70px;text-align:right}

/* таймлайн */
#tl{background:var(--tape);border-bottom:1px solid var(--rule);position:relative}
#cv{display:block;width:100%;height:132px;cursor:pointer}
#tl.cues #cv{height:214px}
#laneHint{position:absolute;left:96px;top:134px;height:74px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);pointer-events:none}
#laneHint[hidden]{display:none}
#laneHint button{pointer-events:auto;padding:2px 9px;font-size:12.5px;background:var(--sheet)}
#sndBtn.on{border-color:var(--ink2);background:var(--hover)}
#insp #redoScope{width:auto;flex:1 1 150px;min-width:0}
#insp h3.sub{font-size:14px;margin:22px 0 6px;padding-top:14px;border-top:1px solid var(--rule)}
#insp input[type=text],#insp input[type=search]{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:6px 8px;width:100%}
#insp input[type=range]{width:100%}
#insp .cfile{font:15px/1.4 var(--serif);margin:2px 0 8px;overflow-wrap:anywhere}
#insp .cfile.none{color:var(--ink2);font:13px/1.4 var(--ui)}
#insp label.chk{display:flex;gap:7px;align-items:baseline;margin:8px 0;color:var(--text)}
#insp .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px} #insp .row2 input{width:100%}
#insp .lanes{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;margin:8px 0 12px}
#insp .lanes label.chk{margin:0}
.dlg input[type=search]{width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:8px 10px;margin:4px 0 10px}
.dlg .snds{max-height:46vh;min-height:120px;overflow:auto;border:1px solid var(--rule)}
.dlg .snd{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:3px 10px 3px 4px;cursor:pointer;border-bottom:1px solid var(--rule)}
.dlg .snd:hover{background:var(--hover)} .dlg .snd span{overflow-wrap:anywhere} .dlg .snd small{color:var(--ink2);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg .snd span i{display:block;font-style:normal;font-size:11.5px;color:var(--ink2);overflow-wrap:anywhere}
.dlg .snd button svg{width:12px;height:12px;display:block}
#mini{display:block;width:100%;height:16px;cursor:pointer;border-top:1px solid var(--rule)}

/* рабочая область */
main{display:grid;grid-template-columns:minmax(0,1fr) 430px;min-height:0}
#sheetWrap{min-height:0;overflow:auto;padding:0 0 60px;scroll-behavior:auto}
#sheet{max-width:920px;margin:18px auto 0;background:var(--sheet);border:1px solid var(--rule);padding:22px 0 36px;min-height:60%}
.para{padding:5px 0}
.ph{display:grid;grid-template-columns:62px 5px minmax(0,1fr) 74px;column-gap:12px;padding:2px 14px 2px 10px;cursor:pointer;border-left:3px solid transparent}
.ph:hover{background:var(--hover)}
.ph time{color:var(--ink2);font-size:12.5px;padding-top:6px;text-align:right}
.ph .tab{background:var(--c);border-radius:2px;margin:5px 0;opacity:.85}
.ph .tx{font:19px/1.62 var(--serif);color:var(--text);overflow-wrap:anywhere}
.ph .tx b{font-weight:700;color:var(--ink)}
.ph .who{font:600 12.5px/1 var(--ui);color:var(--c);margin-right:9px;white-space:nowrap;position:relative;top:-1px}
.ph.head .tx{font:700 23px/1.4 var(--serif);color:var(--ink);padding:8px 0 4px}
.ph .mg{display:flex;gap:5px;align-items:flex-start;justify-content:flex-end;padding-top:7px}
.ph.now{background:var(--now)}
.ph.sel{border-left-color:var(--ink);background:var(--hover)}
.ph.sel.now{background:var(--now)}
.ph.s-locked .tx{color:var(--ink)}
.ph.s-stale .tx,.ph.s-empty .tx,.ph.s-lost .tx{text-decoration:underline wavy var(--red) 1px;text-underline-offset:5px}
.ic{width:16px;height:16px;display:inline-block;flex:none}
.ic.blue{color:var(--blue)} .ic.red{color:var(--red)} .ic.stamp{color:var(--stamp)} .ic.soft{color:var(--ink2)}

/* инспектор */
#insp{border-left:1px solid var(--rule);background:var(--sheet);overflow:auto;padding:16px 18px 40px;min-height:0}
#insp h2{font-size:16px;margin:0 0 2px}
#insp .meta{color:var(--ink2);margin-bottom:12px}
#insp label.f{display:block;color:var(--ink2);margin:14px 0 5px}
#insp select,#insp input[type=number],#insp textarea{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:6px 8px}
#insp select{width:100%}
.chip{display:inline-block;border-radius:3px;padding:1px 8px;font-weight:600;font-size:12.5px;border:1px solid currentColor;vertical-align:1px;margin-left:8px}
.chip.draft{color:var(--ink2)} .chip.edited{color:var(--blue)} .chip.stale,.chip.empty,.chip.lost{color:var(--red)} .chip.locked{color:var(--stamp)}
#words{font:20px/1.7 var(--serif);border:1px solid var(--rule);border-radius:3px;padding:8px 12px;background:var(--paper);min-height:54px;max-height:238px;overflow:auto}
#words .w{white-space:nowrap}
#words .w.mod{box-shadow:0 2px 0 var(--blue)}
#words button.v{border:0;padding:0 1px;border-radius:2px;background:none;font:inherit;color:var(--text);cursor:pointer}
#words button.v:hover{background:var(--blue);color:var(--sheet)}
#words button.v.on{font-weight:700;color:var(--ink)}
#words .c{color:var(--text)}
#words.locked{pointer-events:none;opacity:.8}
#free{width:100%;min-height:92px;font:18px/1.5 var(--serif);resize:vertical}
.orig{color:var(--ink2);font:14px/1.45 var(--serif);margin-top:6px}
.tools{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tools button{padding:3px 9px;font-size:13px}
.chg{margin-top:8px;border-left:3px solid var(--blue);padding:6px 0 6px 10px}
.chg .row{display:flex;align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap}
.chg .pair{font:17px/1.3 var(--serif)} .chg .pair b{font-weight:700}
.chg select{width:auto !important;padding:3px 6px !important}
.chg .cnt{color:var(--ink2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.slider{display:flex;align-items:center;gap:8px}
.slider input[type=range]{flex:1;accent-color:var(--blue)}
.slider output{min-width:46px;font-weight:600}
.stepper{display:flex;align-items:center;gap:4px}
.stepper input{width:76px;text-align:right}
.stepper button{padding:4px 9px}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.takes{margin-top:6px;border-top:1px solid var(--rule)}
.take{display:grid;grid-template-columns:22px 1fr auto auto auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
.take .t2{overflow-wrap:anywhere}
.take button svg{display:block}
.chip.ins{color:var(--blue);border-style:dashed}
.ud.insb{background:var(--blue)}
.ph.ins .tab{background:repeating-linear-gradient(180deg,var(--c) 0 4px,transparent 4px 7px)}
.ph .mg{flex-wrap:wrap}
#insp.dropok{outline:2px dashed var(--blue);outline-offset:-6px}
/* окно обрезки записи */
#trCv{display:block;width:100%;height:132px;border:1px solid var(--rule);cursor:ew-resize;touch-action:none;margin:10px 0 8px}
.trrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.trrow label{color:var(--ink2);display:flex;gap:6px;align-items:center}
.trrow input{width:86px;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:5px 7px}
#trLen{color:var(--ink2)}
.trrow .grow{flex:1 1 10px}
.trtext{font:17px/1.5 var(--serif);color:var(--text);margin:10px 0 0;overflow-wrap:anywhere}
.trtext small{display:block;font:13px/1.4 var(--ui);color:var(--ink2);margin-bottom:2px}
.trtext.nx{margin-top:14px;padding-top:10px;border-top:1px solid var(--rule);color:var(--ink2)}
/* окно вставки */
.dlg textarea.big{display:block;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:8px 10px;font:18px/1.5 var(--serif);resize:vertical;min-height:96px}
.dlg label.f{display:block;color:var(--ink2);margin:12px 0 5px}
.dlg select.wide1{width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:6px 8px}
.dlg .cntr{color:var(--ink2);font-size:12.5px;text-align:right;margin-top:3px}
/* окно проекта */
.pjsave{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.pjsave input{flex:1 1 260px;min-width:0;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:6px 9px}
.dlg h4{margin:18px 0 6px;font-size:15px}
.pjlist{border-top:1px solid var(--rule);max-height:38vh;overflow:auto}
.pj{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--rule)}
.pj .t1{font-weight:600;overflow-wrap:anywhere} .pj .t2{color:var(--ink2);font-size:13px;overflow-wrap:anywhere}
.pj.bad .t1{color:var(--ink2);font-weight:400}
.pj button{padding:3px 10px;white-space:nowrap}
.dlg .pjauto{margin-top:10px;border-bottom:0} .dlg .pjauto summary{cursor:pointer;color:var(--ink2);font-weight:400;font-size:14px}
.dlg .pjauto p.note{font:14px/1.4 var(--ui);color:var(--ink2);margin:8px 0}
.pjcmp td:nth-child(n+2),.pjcmp th:nth-child(n+2){text-align:right;width:22%}
.pjcmp tr.dif td:last-child{font-weight:700;color:var(--blue)}
@media (max-width:640px){ .pj{grid-template-columns:minmax(0,1fr) auto auto} .pj > div:first-child{grid-column:1 / -1} }
.take input{accent-color:var(--blue);margin:0}
.take .t1{font-weight:600} .take .t2{color:var(--ink2);font-size:13px}
.take .warn{color:var(--red)}
.take button{padding:3px 8px}
.flagbox{margin-top:14px;border-left:3px solid var(--red);padding:6px 0 6px 10px;color:var(--ink)}
.flagbox div{margin:2px 0}
.ud{display:inline-block;font:700 10px/1 var(--ui);color:var(--sheet);background:var(--sfx);border-radius:2px;padding:2px 3px;vertical-align:middle}
.stbox{margin-top:8px;border-left:3px solid var(--sfx);padding:6px 0 6px 10px}
.stbox .row{display:flex;align-items:center;gap:5px;margin:6px 0;flex-wrap:wrap}
.stbox .pair{font:17px/1.3 var(--serif)} .stbox .pair b{font-weight:700}
.stbox .why{color:var(--ink2);font-size:12px;flex:1 1 55%}
.stbox button{padding:2px 6px;font-size:12px;font-weight:400}
.stbox details{margin-top:6px} .stbox summary{cursor:pointer;color:var(--ink2);font-size:13px}
.stline{align-items:center;gap:8px} .stline span{flex:1 1 200px}
.dlg.wide{max-width:1120px;width:min(96vw,1120px)}
.vz{display:grid;grid-template-columns:minmax(230px,34%) 1fr;gap:16px}
.vz .col{border:1px solid var(--rule);height:52vh;overflow:auto}
.vz .rl,.vz .vc{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--rule)}
.vz .rl{cursor:pointer} .vz .rl:hover{background:var(--hover)} .vz .rl.cur{background:var(--now)}
.vz small{color:var(--ink2);display:block;overflow-wrap:anywhere}
.vz .vc.fit{box-shadow:inset 3px 0 0 var(--stamp)} .vz .vc.own{background:var(--now)}
.vz .b{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.vz button{padding:2px 8px;font-size:12.5px}
.vz .flt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.vz .flt select,.vz .flt input{width:auto;padding:4px 6px;margin:0}
.vz h4{margin:0 0 8px;font-size:15px}
.goline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vz details.vnew{margin-top:8px;border:1px solid var(--rule);padding:6px 8px}
.vz details.vnew summary{cursor:pointer;font-size:13.5px}
.vz details.vnew textarea{width:100%;box-sizing:border-box;margin:6px 0;font:13px/1.35 var(--ui);padding:5px 6px}
.vz details.vnew input{flex:1 1 160px}
.stline label{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:4px;white-space:nowrap}
.note{color:var(--ink2);margin:8px 0;overflow-wrap:anywhere}
.busy{color:var(--blue);margin-top:10px}
.sum{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 16px}
.sum b{text-align:right}
kbd{font:600 12px var(--ui);border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 5px;background:var(--paper)}

/* полоса сообщений, шторка, окна */
#banner{position:fixed;left:16px;bottom:calc(var(--jb, 34px) + 12px);display:flex;flex-direction:column;gap:8px;z-index:20;max-width:560px}
.bn{overflow-wrap:anywhere;background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--ink2);padding:9px 12px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 18px rgba(0,20,30,.14)}
.bn.red{border-left-color:var(--red)} .bn.ok{border-left-color:var(--stamp)} .bn.blue{border-left-color:var(--blue)}
.bn button{padding:3px 9px;white-space:nowrap}
#veil{position:fixed;inset:0;background:rgba(10,18,24,.42);z-index:30;display:grid;place-items:center}
#veil[hidden]{display:none}
.dlg{background:var(--sheet);border:1px solid var(--rule);max-width:860px;width:min(92vw,860px);max-height:86vh;overflow:auto;padding:22px 26px}
.dlg h3{margin:0 0 12px;font-size:19px}
.dlg table{border-collapse:collapse;width:100%}
.dlg th{text-align:left;color:var(--ink2);font-weight:400;padding:5px 10px 5px 0;border-bottom:1px solid var(--rule)}
.dlg td{padding:7px 10px 7px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
.dlg tr.cur td{background:var(--hover)}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.dlg .hits{max-height:300px;overflow:auto;border:1px solid var(--rule);padding:6px 10px;margin:10px 0;font:15px/1.5 var(--serif)}
.dlg .hits div{margin:3px 0} .dlg .hits small{font:12px var(--ui);color:var(--ink2);margin-right:8px}
.dlg .hits u{text-decoration:none;background:color-mix(in srgb, var(--blue) 22%, transparent);padding:0 2px;border-radius:2px}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);z-index:40;font-size:17px;color:var(--ink2);text-align:center}
#load[hidden]{display:none}
#loadSub{position:fixed;left:0;right:0;top:calc(50% + 24px);text-align:center;z-index:41;color:var(--blue);font-size:14px;pointer-events:none}
#load[hidden] + #loadSub{display:none}

/* узкое окно: шапка и транспорт сжимаются, а не переносят подписи и не вылезают за край */
#top button,#transport button{white-space:nowrap}
.partnav{min-width:0} #partInfo{overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:1340px){ #top{gap:10px;padding:8px 10px} #top .brand small{display:none} #top nav{gap:4px} #top nav button{padding:5px 8px}
  #transport{gap:6px;padding:7px 10px;flex-wrap:wrap;row-gap:6px} #top{flex-wrap:wrap;row-gap:6px} #zoomv{display:none} #jsys span + span{display:none} }
@media (max-width:1120px){ #partInfo{display:none} #btnKeys{display:none} #transport .sep{display:none} }   /* клавиши остаются в «Справке» */

/* журнал: полоса внизу — что студия делает сейчас и что с компьютером; раскрывается в ленту событий */
#jr{border-top:1px solid var(--rule);background:var(--sheet);min-height:0;display:flex;flex-direction:column;position:relative}
#jgrip{position:absolute;left:0;right:0;top:-3px;height:6px;cursor:ns-resize;z-index:2}
#jbar{display:flex;align-items:center;gap:16px;padding:2px 14px 2px 6px;min-height:30px;font-size:13px;min-width:0;overflow:hidden}
#jtog{border-color:transparent;padding:3px 8px;display:flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
#jtog svg{width:9px;height:9px;transition:transform .15s} #jr.open #jtog svg{transform:rotate(90deg)}
@media (prefers-reduced-motion: reduce){ #jtog svg{transition:none} .bar.run u{animation:none !important;width:100% !important;opacity:.45} }
#jbadge{background:var(--red);color:var(--sheet);border-radius:9px;padding:0 6px;font-size:11.5px;font-weight:700;min-width:18px;text-align:center}
#jbadge.warn{background:var(--sfx)} #jbadge[hidden]{display:none}
#jop{display:flex;align-items:center;gap:9px;color:var(--blue);white-space:nowrap;max-width:46%;overflow:hidden}
#jop[hidden]{display:none} #jopt{overflow:hidden;text-overflow:ellipsis}
.bar{display:inline-block;width:88px;height:5px;background:var(--tape);border:1px solid var(--rule);border-radius:3px;overflow:hidden;vertical-align:1px;flex:none}
.bar u{display:block;height:100%;background:currentColor;text-decoration:none;width:0}
.bar.run u{width:34%;animation:jslide 1.15s linear infinite}
@keyframes jslide{from{margin-left:-34%}to{margin-left:100%}}
#jlast{flex:1;min-width:0;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#jlast.err{color:var(--red)} #jlast.warn{color:var(--sfx)}
#jsys{display:flex;gap:18px;color:var(--ink2);white-space:nowrap;flex:none} #jsys b{color:var(--ink);font-weight:600} #jsys .bar{color:var(--ink2);width:64px}
#jbody{display:flex;flex-direction:column;height:var(--jh, 250px);min-height:120px;max-height:46vh;border-top:1px solid var(--rule)}
#jbody[hidden]{display:none}
#jtools{display:flex;gap:6px;align-items:center;padding:6px 14px 5px;flex-wrap:wrap}
#jtools button{padding:2px 10px;font-size:13px} #jtools button.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
#jtools .sp{flex:1}
#jmeters{display:flex;gap:6px 24px;padding:0 14px 7px;color:var(--ink2);font-size:13px;flex-wrap:wrap} #jmeters b{color:var(--ink);font-weight:600} #jmeters .bar{color:var(--ink2)}
#jmeters .hot b{color:var(--red)}
#jlist{flex:1;min-height:0;overflow:auto;background:var(--tape);padding:5px 0 8px;font-size:13px;line-height:1.5}
.je{display:grid;grid-template-columns:62px 78px minmax(0,1fr);column-gap:10px;padding:0 14px 0 9px;border-left:3px solid transparent}
.je time,.je .js{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.je .jm{overflow-wrap:anywhere;color:var(--text)}
.je.l-ok{border-left-color:var(--stamp)} .je.l-run{border-left-color:var(--blue)} .je.l-edit .js{color:var(--mus)}
.je.l-warn{border-left-color:var(--sfx)} .je.l-warn .jm{color:var(--sfx)}
.je.l-err{border-left-color:var(--red)} .je.l-err .jm{color:var(--red);font-weight:600}
.je.l-eng .jm{font:12.5px/1.5 Consolas,"Cascadia Mono","Lucida Console",monospace;color:var(--ink2);white-space:pre-wrap}
.je.more{cursor:pointer} .je.more .jm::after{content:"  подробности";color:var(--blue);font-weight:400}
.je pre{grid-column:1 / -1;margin:3px 0 8px 150px;font:12px/1.45 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;color:var(--ink2);overflow-wrap:anywhere}
.dlg details{border-bottom:1px solid var(--rule);padding:8px 0} .dlg details p{margin:8px 0 4px;color:var(--text);font:16px/1.55 var(--serif);max-width:74ch}
.dlg summary{cursor:pointer;font-weight:600;font-size:15px} .dlg details[open] summary{color:var(--blue)}
#insp .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px} #insp .row3 input{width:100%}
/* 11g: соединённые фразы, пауза после, поиск по спискам, голоса */
.ud.joinb{background:var(--stamp)}
.aft{display:inline-block;font:600 10px/1 var(--ui);color:var(--ink2);border:1px solid var(--rule);border-radius:2px;padding:1px 3px;vertical-align:middle}
.joinbox{border:1px dashed var(--stamp);border-radius:3px;padding:6px 8px;margin:8px 0;font-size:13px}
.joinbox .jr{color:var(--ink2);overflow-wrap:anywhere;margin-top:3px}
.afterrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.afterrow .q{display:flex;gap:3px}
.afterrow .q button{padding:3px 7px;font-size:12.5px}
.afterrow .q button.on{background:var(--now);border-color:var(--ink2)}
.rolerow{display:flex;gap:6px;align-items:center;position:relative}
.rolerow select{flex:1 1 auto;min-width:0}
.pickpop{position:fixed;z-index:60;background:var(--sheet);border:1px solid var(--ink2);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.28);padding:6px;display:flex;flex-direction:column;max-height:330px}
.pickpop input{width:100%;margin:0 0 6px;padding:5px 7px;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:3px}
.pickpop .lst{overflow:auto}
.pickpop .it{padding:4px 8px;border-radius:3px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.pickpop .it small{color:var(--ink2);white-space:nowrap}
.pickpop .it.on{background:var(--now)} .pickpop .it:hover{background:var(--hover)}
.pickpop .grp{font-size:11.5px;color:var(--ink2);padding:6px 8px 2px}
.pickpop .none{padding:8px;color:var(--ink2)}
.vz .rsearch{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap}
.vz .rsearch input{flex:1 1 110px;padding:4px 6px;margin:0;min-width:0}
.vz .rsearch select{width:auto;padding:4px 6px;margin:0}
.vz .col.rcol{height:calc(52vh - 36px)}
.vz .col.bcol{height:calc(52vh - 46px)}
.vz .hist #vHistBox{max-height:22vh;overflow:auto;margin-top:4px}
.vz .rl small b.upd{color:var(--sfx)}
.vz .hist{border:1px solid var(--rule);padding:6px 8px;margin:0 0 8px}
.vz .hist summary{cursor:pointer;font-size:13.5px}
.vz .hist .hr{display:flex;gap:8px;align-items:center;padding:3px 0}
.tidy ul{margin:4px 0 10px 18px;padding:0;max-height:20vh;overflow:auto}
#dlg [hidden]{display:none}
#dlgQ{margin:6px 0 10px}
</style>
</head>
<body>
<header id="top">
  <div class="brand">Нокс Студия<small id="bookTitle"></small></div>
  <div class="partnav">
    <button id="prevPart" class="ghost" title="Предыдущая часть">‹</button>
    <button id="partBtn" title="Все части и главы">Часть</button>
    <button id="nextPart" class="ghost" title="Следующая часть">›</button>
    <span id="partInfo" class="num"></span>
  </div>
  <nav>
    <button id="btnProj" title="Сохранить работу в файл проекта, вернуться к сохранённому (Ctrl+S — сохранить, Ctrl+O — это окно)">Проект</button>
    <button id="btnParts">Части и главы</button>
    <button id="btnRules">Правила</button>
    <button id="btnVoices" title="Голоса ролей: банк заготовленных голосов, подбор, проба на реплике">Голоса</button>
    <button id="btnKeys">Клавиши</button>
    <button id="btnHelp" title="Как сделать: короткие примеры (F1)">Справка</button>
    <button id="btnTheme" class="ghost" title="Переключить светлую и тёмную тему">Тема</button>
  </nav>
  <button id="engine" title=""><i></i><span>движок</span></button>
</header>

<section id="transport">
  <button id="play" title="Слушать / стоп (пробел)"></button>
  <div id="clock" class="num">00:00.0 <span>/ 00:00</span></div>
  <button id="back5" class="ghost" title="Назад на 5 секунд (←)">−5 с</button>
  <button id="fwd5" class="ghost" title="Вперёд на 5 секунд (→)">+5 с</button>
  <div class="sep"></div>
  <button id="markBtn" title="Пометить фразу, которая звучит (M)">Пометить</button>
  <button id="prevAtt" class="ghost" title="К предыдущей фразе, требующей внимания ([)">‹ место</button>
  <button id="nextAtt" class="ghost" title="К следующей фразе, требующей внимания (])">место ›</button>
  <div class="sep"></div>
  <button id="sndBtn" title="Показать или скрыть дорожки звуков, фона и музыки">Звуки и музыка</button>
  <div class="right">
    <span id="zoomv" class="num"></span>
    <button id="zout" class="ghost" title="Мельче">−</button>
    <button id="zin" class="ghost" title="Крупнее">+</button>
    <div class="sep"></div>
    <button id="goNext" class="pri" hidden></button>
    <button id="goStop" hidden title="Остановить озвучку части. Озвученное сохранится — потом можно продолжить">Стоп</button>
    <button id="redoAll" class="pri" hidden></button>
    <button id="lockPart" class="lockb">Закрепить часть</button>
  </div>
</section>

<section id="tl"><canvas id="cv"></canvas><canvas id="mini"></canvas>
  <div id="laneHint" hidden><span>Дорожки пусты: звуков, фона и музыки в этой части пока нет.</span><button id="lhKit" type="button" title="Отметки звуков, фона и музыки из партитуры книги появятся на дорожках со своими файлами и громкостями">Взять партитуру книги</button><button id="lhScan" type="button" title="Студия найдёт в тексте части места для звуков и поставит подписанные заглушки">Найти места по тексту</button></div></section>

<main>
  <div id="sheetWrap"><article id="sheet" tabindex="0" aria-label="Технический текст части"></article></div>
  <aside id="insp"></aside>
</main>

<footer id="jr">
  <div id="jgrip" hidden title="Потяните, чтобы изменить высоту журнала"></div>
  <div id="jbar">
    <button id="jtog" aria-expanded="false" aria-controls="jbody" title="Журнал: что студия делает сейчас, вывод движка, состояние компьютера (клавиша J)"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>Журнал<b id="jbadge" hidden></b></button>
    <div id="jop" hidden><span id="jopt"></span><i class="bar"><u></u></i></div>
    <div id="jlast"></div>
    <div id="jsys" class="num"></div>
  </div>
  <div id="jbody" hidden>
    <div id="jtools">
      <button data-jf="all" class="on">Всё</button><button data-jf="imp" title="Только замечания и сбои">Важное</button><button data-jf="eng" title="Вывод движка озвучки и ход переозвучки">Движок</button><button data-jf="edit" title="Что вы меняли">Правки</button><button data-jf="chk" title="Строки самопроверки">Проверка</button>
      <span class="sp"></span>
      <button id="jCheck" title="Проверить заново: книга, записи, ffmpeg, голоса, движок, видеокарта, звуки, место на диске">Проверить всё</button>
      <button id="jClean" title="Удалить кэш студии. Он пересчитывается сам; правки, дубли и готовые файлы не затрагиваются">Очистить кэш</button>
      <button id="jOpenG" title="Открыть папку готовых частей и глав">Папка готового</button>
      <button id="jOpenS" title="Открыть папку студии: правки, дубли, файлы журналов">Папка студии</button>
      <button id="jCopy" title="Скопировать показанные строки — например, чтобы прислать их, если что-то сломалось">Скопировать</button>
    </div>
    <div id="jmeters" class="num"></div>
    <div id="jlist" role="log" aria-label="Журнал студии" tabindex="0"></div>
  </div>
</footer>

<div id="banner"></div>
<div id="veil" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<div id="load">Открываю книгу…</div>
<div id="loadSub"></div>
<audio id="au" preload="auto"></audio>
<audio id="aux" preload="auto"></audio>
<input id="sndFile" type="file" accept="audio/*,.wav,.mp3,.ogg,.flac,.m4a,.aac,.opus,.wma,.aif,.aiff" hidden>
<input id="pjFile" type="file" accept=".noxproj" hidden>

<script>
"use strict";
const TOKEN = "__NOX_TOKEN__";
const AC = "́", VOW = "аеёиоуыэюяАЕЁИОУЫЭЮЯ";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const au = $("#au"), aux = $("#aux"), cv = $("#cv"), mini = $("#mini");
const S = {book:null, parts:[], chapters:[], roles:[], rules:[], engine:{}, gotovo:{}, part:null, n:0, sel:null, ed:null,
           zoom:36, scrollT:0, peaks:null, jobs:[], stopAt:null, lastScroll:0, busy:false, notes:{}, free:false};
const ROLE_HUES = ["#B8792B","#8A4F7D","#4F6D8F","#7A7F2E","#9A5B43","#4E8087","#A06A8C","#A68A5B","#5E5F8E","#6C7F4A"];
const STATE_NAME = {draft:"черновик", edited:"правка", stale:"переозвучить", empty:"нет записи", lost:"потерян дубль", locked:"закреплено"};
const ICON = {
  lock:'<svg class="ic stamp" viewBox="0 0 16 16"><path fill="currentColor" d="M4 7V5a4 4 0 0 1 8 0v2h1v7H3V7zm2 0h4V5a2 2 0 0 0-4 0z"/></svg>',
  pen:'<svg class="ic blue" viewBox="0 0 16 16"><path fill="currentColor" d="M11.5 1.5l3 3L6 13l-4 1 1-4z"/></svg>',
  flag:'<svg class="ic red" viewBox="0 0 16 16"><path fill="currentColor" d="M3 1h1v14H3zm2 1h8l-2 3 2 3H5z"/></svg>',
  redo:'<svg class="ic red" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M13 8a5 5 0 1 1-1.5-3.6M12 1v4H8"/></svg>',
  warn:'<svg class="ic red" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M8 2l6.5 12h-13zM8 6.5v4M8 12v1"/></svg>',
  play:'<svg width="14" height="14" viewBox="0 0 14 14"><path fill="currentColor" d="M3 1l10 6-10 6z"/></svg>',
  stop:'<svg width="14" height="14" viewBox="0 0 14 14"><path fill="currentColor" d="M2 2h4v10H2zm6 0h4v10H8z"/></svg>',
  mic:'<svg class="ic stamp" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1a2.5 2.5 0 0 0-2.5 2.5v4a2.5 2.5 0 0 0 5 0v-4A2.5 2.5 0 0 0 8 1z"/><path fill="none" stroke="currentColor" stroke-width="1.4" d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v3M5.5 15h5"/></svg>',
  cut:'<svg width="14" height="14" viewBox="0 0 14 14"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M2 1v12M12 1v12M5 7h4M5 4.5v5M9 4.5v5"/></svg>'
};

// ---------------------------------------------------------------- сервер
async function api(path, body){
  const o = body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json","X-Nox-Token":TOKEN}, body:JSON.stringify(body)};
  let r, j;
  const mine = body !== undefined;                             // своё действие (не опрос): фоновые обновления его не перебивают
  if(mine){ S.act = (S.act || 0) + 1; S.posts = (S.posts || 0) + 1; }
  try {
    try { r = await fetch(path, o); } catch(e){ throw new Error("студия не отвечает — запустите её ярлыком ещё раз"); }
    try { j = await r.json(); } catch(e){ j = {error:"студия ответила непонятно"}; }
  } finally { if(mine) S.posts--; }
  if(r.status === 403 && /окно устарело/.test(j.error || "")){      // студию перезапустили или обновили — этому окну нужна новая страница
    let last = 0; try { last = +sessionStorage.getItem("nox.reload") || 0; } catch(e){}
    if(Date.now() - last > 20000){ try { sessionStorage.setItem("nox.reload", String(Date.now())); } catch(e){} location.reload(); }
  }
  if(!r.ok || j.error) throw new Error(j.error || ("ошибка " + r.status));
  return j;
}
function toast(text, kind="", ms=5200, btn=null){
  const d = document.createElement("div");
  d.className = "bn " + kind;
  d.innerHTML = "<div>" + esc(text) + "</div>";
  if(btn){ const b = document.createElement("button"); b.textContent = btn[0]; b.onclick = () => { d.remove(); btn[1](); }; d.appendChild(b); }
  $("#banner").appendChild(d);
  if(ms) setTimeout(() => d.remove(), ms);
  return d;
}
const fail = e => toast(e.message || String(e), "red", 9000);
function fmt(t, dec=1){ t = Math.max(0, t || 0); const m = Math.floor(t/60), s = t - m*60; return String(m).padStart(2,"0") + ":" + (dec ? s.toFixed(dec).padStart(4,"0") : String(Math.floor(s)).padStart(2,"0")); }
function roleName(r){ return r === "narrator" ? "Рассказчик" : r; }
function roleColor(r){ if(r === "narrator") return "#8A959E"; let h = 0; for(const c of r) h = (h*31 + c.charCodeAt(0)) >>> 0; return ROLE_HUES[h % ROLE_HUES.length]; }
function techHTML(t){ return esc(t).replace(new RegExp("([" + VOW + "])" + AC, "g"), "<b>$1" + AC + "</b>"); }
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// ---------------------------------------------------------------- книга и часть
async function loadState(){
  const st = await api("/api/state");
  Object.assign(S, {book:st.book, parts:st.parts, chapters:st.chapters, roles:st.roles, rules:st.rules, engine:st.engine, gotovo:st.gotovo, orphans:st.orphans, cueLabels:st.cue_labels || {}, score:st.score || {}, ver:st.ver, go:st.go || {}});
  drawGo();
  $("#bookTitle").textContent = st.book.title;
  document.title = "Нокс Студия — " + st.book.title;
  drawEngine();
}
async function openPart(n){
  commitFree();
  if(S.ed && S.ed.dirty) await saveEd();
  const seq = S.openSeq = (S.openSeq || 0) + 1;
  $("#load").hidden = false; $("#load").textContent = "Собираю предпросмотр части " + n + "…";
  try {
    const p = await api("/api/part?n=" + n);
    if(seq !== S.openSeq) return;                              // пока собиралась, открыли другую часть
    au.pause(); S.stopAt = null;
    S.n = n; S.sel = null; S.cue = null; S.drag = null; S.ed = null; S.free = false; S.scrollT = 0; S.peaks = null;
    try { localStorage.setItem("nox.part:" + S.book.root, String(n)); } catch(e){}
    setPart(p, true);
    await loadState();
    drawTop();
  } catch(e){ if(seq === S.openSeq) fail(e); }
  if(seq === S.openSeq) $("#load").hidden = true;
}
function segAt(t){ const a = S.part ? S.part.segs : []; let lo = 0, hi = a.length - 1, r = -1; while(lo <= hi){ const m = (lo+hi) >> 1; if(a[m].t0 <= t){ r = m; lo = m+1; } else hi = m-1; } return r; }
function segOf(uid){ return S.part ? S.part.segs.find(s => s.uid === uid) : null; }
function setPart(p, fresh=false){
  if(!p || p.n !== S.n) return;                                // запоздавший ответ про другую часть — не наш
  const old = S.part, t = au.currentTime || 0;
  let keep = null;
  if(old && !fresh){ const k = segAt(t); if(k >= 0) keep = {uid: old.segs[k].uid, off: t - old.segs[k].t0}; }
  S.part = p;
  if(fresh){ let pref = null; try { pref = localStorage.getItem("nox.cues"); } catch(e){} S.showCues = pref === "1" || (pref !== "0" && ((p.cues || []).length > 0 || !!(S.score && S.score.have))); $("#tl").classList.toggle("cues", !!S.showCues); $("#sndBtn").classList.toggle("on", !!S.showCues); }
  laneHint();
  layoutCues(p);
  if(S.cue && !cueOf(S.cue)) S.cue = null;
  if(fresh || !old || old.ver !== p.ver){
    const was = !au.paused;
    au.src = "/audio/part?n=" + p.n + "&v=" + p.ver;
    au.load();
    let nt = 0;
    if(keep){ const s = segOf(keep.uid); if(s) nt = Math.min(s.t0 + Math.max(keep.off, 0), s.t1); }
    au.addEventListener("loadedmetadata", () => { try { au.currentTime = nt; } catch(e){} if(was) au.play().catch(()=>{}); }, {once:true});
    fetch("/peaks?n=" + p.n + "&v=" + p.ver).then(r => r.arrayBuffer()).then(b => { if(S.part && S.part.n === p.n && S.part.ver === p.ver){ S.peaks = new Uint8Array(b); draw(); } }).catch(()=>{});
  }
  if(S.sel && !segOf(S.sel)){ S.sel = null; S.ed = null; }
  if(S.ed && !S.ed.dirty && !S.free){ const s = segOf(S.ed.uid); if(s){ S.ed.tokens = tokenize(s.tech); S.ed.role = s.role; } }
  drawSheet(); drawInsp(); drawTop(); drawBanner(); draw();
  if(p.stress && p.stress.busy) stressWatch();
}
let stressT = 0;
function udAll(){ try { return localStorage.getItem("nox.udAll") === "1"; } catch(e){ return false; } }
function stressWatch(){                                         // идёт сверка ударений — дождаться и показать значки
  clearTimeout(stressT);
  stressT = setTimeout(async () => {
    if(!S.n || !S.part) return;
    try {
      const n0 = S.n, a0 = S.act, p = await api("/api/part?n=" + n0);
      if(n0 !== S.n) return;
      if(p.stress && p.stress.busy){ stressWatch(); return; }
      if(a0 === S.act && !S.posts && !(S.ed && S.ed.dirty)){ setPart(p); if(p.stress && p.stress.imp) toast("Сверка ударений: стоит послушать фраз — " + p.stress.imp + ". У них значок «уд.»; клавиша ] ведёт к следующей.", "", 9000); }
      else stressWatch();
    } catch(e){}
  }, 3500);
}
function drawTop(){
  const p = S.part; if(!p) return;
  $("#partBtn").textContent = "Часть " + String(p.n).padStart(2,"0");
  const c = {}; for(const s of p.segs) c[s.state] = (c[s.state]||0) + 1;

// ---------------------------------------------------------------- лента технического текста

const ownChosen = s => (s.takes || []).some(t => t.chosen && t.src === "import");
function phTitle(s){

}

// ---------------------------------------------------------------- выбор фразы и её правка
async function select(uid, seek){
  S.cue = null;
  if(S.sel === uid){ if(seek) seekTo(segOf(uid).t0); return; }
  commitFree();
  if(S.ed && S.ed.dirty) await saveEd();
  S.sel = uid; S.free = false;
  const s = segOf(uid);
  S.ed = s ? {uid, role:s.role, tokens:tokenize(s.tech), dirty:false} : null;
  markSel(); drawInsp(); draw();
  if(s && seek) seekTo(s.t0);
}
function tokenize(t){
  const out = [], re = /[А-Яа-яЁё́]+/g; let pos = 0, m;
  while((m = re.exec(t))){ if(m.index > pos) out.push({w:false, t:t.slice(pos, m.index)}); out.push({w:true, t:m[0]}); pos = m.index + m[0].length; }
  if(pos < t.length) out.push({w:false, t:t.slice(pos)});
  return out;
}
const joinTok = tk => tk.map(x => x.t).join("");
const bareW = w => w.split(AC).join("");
function stressAt(w){ let k = -1; for(const ch of w){ if(ch === AC) return k; k++; } return -1; }
function setStress(w, k){ const b = bareW(w); return stressAt(w) === k ? b : b.slice(0, k+1) + AC + b.slice(k+1); }
function edText(){ return S.ed ? joinTok(S.ed.tokens).replace(/\s+/g, " ").trim() : ""; }
function changedWords(s){
  if(!S.ed) return [];
  const a = tokenize(s.auto ?? s.base_tech).filter(x => x.w), b = S.ed.tokens.filter(x => x.w), out = [];
  if(a.length !== b.length) return out;
  for(let i = 0; i < a.length; i++) if(a[i].t !== b[i].t) out.push({from:a[i].t, to:b[i].t});
  return out;
}
// «п+осох» и «посо+х» -> «по́сох»; прежнее ударение в слове при этом снимается (плюсом его переносят)
function plusToAcute(t){
  return t.replace(/[А-Яа-яЁё\u0301+]*\+[А-Яа-яЁё\u0301+]*/g, w => {
    const b = w.split(AC).join("");
    const b2 = b.replace(new RegExp("\\+([" + VOW + "])", "g"), "$1" + AC).replace(new RegExp("([" + VOW + "])\\+", "g"), "$1" + AC);
    return b2 !== b ? b2 : w;
  });
}
function commitFree(){
  const f = $("#free");
  if(S.free && f && S.ed){ const v = plusToAcute(f.value); if(v !== joinTok(S.ed.tokens)){ S.ed.tokens = tokenize(v); S.ed.dirty = true; } }
}
// правка ударения или роли записывается сама через треть секунды: состояние фразы сразу честное, при закрытии окна ничего не теряется
let saveT = 0;
function saveSoon(force){
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    const ae = document.activeElement;
    if(ae && ae.tagName === "SELECT"){ saveSoon(force); return; }   // открыт выпадающий список — не перерисовывать под рукой
    if(S.ed && S.ed.dirty && (force || !S.free)) saveEd();
  }, 350);
}
async function saveEd(){
  clearTimeout(saveT);
  commitFree();
  const ed = S.ed; if(!ed || !ed.dirty) return;
  const s = segOf(ed.uid); if(!s || s.locked){ ed.dirty = false; return; }
  ed.dirty = false;
  try { const r = await api("/api/seg", {uid:ed.uid, part:S.n, set:{role:ed.role, tech:edText()}}); if(r.part) setPart(r.part); }
  catch(e){ fail(e); }
}
function wordsHTML(s){
  const ch = new Set(), a = tokenize(s.auto ?? s.base_tech).filter(x => x.w), b = S.ed.tokens.filter(x => x.w);
  if(a.length === b.length) b.forEach((x, i) => { if(x.t !== a[i].t) ch.add(x); });
  let h = "";
  S.ed.tokens.forEach((tk, wi) => {
    if(!tk.w){ h += '<span class="c">' + esc(tk.t) + '</span>'; return; }
    const b = bareW(tk.t), sp = stressAt(tk.t);
    h += '<span class="w' + (ch.has(tk) ? " mod" : "") + '">';
    for(let k = 0; k < b.length; k++){
      const c = b[k];
      h += VOW.includes(c) ? '<button class="v' + (k === sp ? " on" : "") + '" data-w="' + wi + '" data-k="' + k + '" title="Ударение сюда">' + esc(c) + (k === sp ? AC : "") + '</button>'
                           : '<span class="c">' + esc(c) + '</span>';
    }
    h += '</span>';
  });
  return h;
}

const LAY = {q:"й",w:"ц",e:"у",r:"к",t:"е",y:"н",u:"г",i:"ш",o:"щ",p:"з","[":"х","]":"ъ",a:"ф",s:"ы",d:"в",f:"а",g:"п",h:"р",j:"о",k:"л",l:"д",";":"ж","'":"э",z:"я",x:"ч",c:"с",v:"м",b:"и",n:"т",m:"ь",",":"б",".":"ю","`":"ё"};
const normQ = s => (s || "").toLowerCase().replace(/ё/g, "е").replace(/\s+/g, " ").trim();
const relayout = s => s.replace(/[a-z\[\];',.`]/g, c => LAY[c] || c);

// начало слова — ценнее середины. Запрос, набранный в латинской раскладке («cnfhbr»), читается и как русский («старик»).
function smartScore(q, text){
  q = normQ(q); if(!q) return 1;

  if(!sc && /[a-z]/.test(q) && !/[а-я]/.test(q)) sc = one(relayout(q)) * 0.9;
  return sc;
}
// Поиск по строкам длинного списка в открытом окне: строки, не подходящие запросу, прячутся. Поле появляется от девяти строк.
function dlgSearch(rowsSel, ph, afterSel){
  const rows = [...document.querySelectorAll("#dlg " + rowsSel)], at = document.querySelector("#dlg " + (afterSel || "h3"));

    none.hidden = n > 0;

// Список с поиском под блоком anchorSel (над ним, если снизу тесно): items = [{v, label, sub, grp, find}], cur — выбранное,
// onPick(v). Это отдельный слой поверх страницы: его не режет окно вставки и не сносит перерисовка окна фразы.
// openerSel — кнопка, которая его открывает: повторный щелчок по ней закрывает список. key — к чему список относится (фраза).
let PICK = null;
function pickOpen(anchorSel, openerSel, items, cur, onPick, key){
  if(PICK){ const same = PICK.sel === anchorSel; PICK.close(); if(same) return; }
  if(!document.querySelector(anchorSel)) return;
  const pop = document.createElement("div"); pop.className = "pickpop";
  pop.innerHTML = '<input type="search" placeholder="имя или его часть: «стар», «капит»…" aria-label="Поиск по списку"><div class="lst"></div>';
  document.body.appendChild(pop);

  let shown = [], at = 0;
  const place = () => {
    const b = document.querySelector(anchorSel);
    if(!b || !b.getClientRects().length){ close(); return; }
    const r = b.getBoundingClientRect(), below = innerHeight - r.bottom - 10, above = r.top - 10, up = below < 200 && above > below;
    pop.style.left = r.left + "px"; pop.style.width = r.width + "px";

    if(up){ pop.style.top = "auto"; pop.style.bottom = (innerHeight - r.top + 2) + "px"; }

const CUE_KINDS = ["sfx", "amb", "mus"], CUE_NAME = {sfx:"Звук", amb:"Фон", mus:"Музыка"}, LANE_NAME = {sfx:"звуки", amb:"фон", mus:"музыка"};
const CUE_VAR = {sfx:"--sfx", amb:"--amb", mus:"--mus"};
const SND_RE = /\.(wav|mp3|ogg|oga|flac|m4a|aac|opus|wma|aif|aiff)$/i;
function cueOf(id){ return S.part && S.part.cues ? S.part.cues.find(c => c.id === id) : null; }
// Высота дорожки: обычно 22; когда на ней 3–4 звука сразу (несколько петель фона) — по 11 на строку, чтобы подписи читались
function laneH(kd){ const r = ((S.part && S.part.laneRows) || {})[kd] || 1; return r > 2 ? 11 * r : 22; }
function laneSize(){                                           // лента подрастает ровно на высоту дорожек

}
function geom(){
  const H = cv.clientHeight, RH = 22, TY = RH + 6, lanes = S.showCues ? 3 : 0, LH = 22, LG = 4;
  const LHs = CUE_KINDS.map(laneH), LT = H - 6 - (lanes ? LHs.reduce((a, b) => a + b + LG, 0) : 0);

function laneY(kind){ const G = geom(), i = CUE_KINDS.indexOf(kind); let y = G.LT + G.LG; for(let j = 0; j < i; j++) y += G.LHs[j] + G.LG; return y; }
function laneAt(y){
  const G = geom(); if(!G.lanes || y < G.LT) return null;
  let top = G.LT + G.LG / 2;
  for(let i = 0; i < 3; i++){ const h = G.LHs[i] + G.LG; if(y < top + h || i === 2) return CUE_KINDS[i]; top += h; }
}
function cueSpan(c){ return S.drag && S.drag.id === c.id ? [S.drag.t0, S.drag.t1] : [c.t0, c.t1]; }
function layoutCues(p){

    const ends = [];

      const lap = kd === "sfx" ? 0.02 : 2.6;                   // фон и музыка сменяются с перекрытием на затухание — это та же строка
      let r = ends.findIndex(e => e <= c.t0 + lap);

  const G = geom(), [a, b] = cueSpan(c), rows = (S.part.laneRows || {})[c.kind] || 1, h = G.LHs[CUE_KINDS.indexOf(c.kind)] / rows;
  const x0 = (a - S.scrollT) * S.zoom, x1 = (b - S.scrollT) * S.zoom;

function cueAt(x, y){

function cueGain(c){ return cueLive(c) ? (S.part.mix[c.kind] || 0) * c.vol : 0; }

function drawLanes(g, W, t0, ink, ink2){

    if(c.id === S.cue){ g.globalAlpha = 1; g.strokeStyle = ink; g.lineWidth = 2; g.strokeRect(x0 + 1, y + 1, w - 2, h - 2); }
    g.globalAlpha = 1;
  }

}
// ---- проигрывание звуков вместе с голосом: у каждой заглушки свой маленький плеер, он идёт следом за головкой
const CUEP = new Map();
function dropPlayer(id){ const p = CUEP.get(id); if(p){ try { p.el.pause(); p.el.removeAttribute("src"); p.el.load(); } catch(e){} CUEP.delete(id); } }
function syncCues(){
  const p = S.part; if(!p || !p.cues){ for(const id of [...CUEP.keys()]) dropPlayer(id); return; }
  const t = au.currentTime || 0, playing = !au.paused && !au.seeking, live = new Set();
  for(const c of p.cues){
    const g = cueGain(c);
    if(!c.cv || g <= 0 || t < c.t0 - 6 || t > c.t1 + 0.3){ continue; }
    live.add(c.id);
    let pl = CUEP.get(c.id);
    if(pl && pl.cv !== c.cv){ dropPlayer(c.id); pl = null; }
    if(!pl){ const el = new Audio(); el.preload = "auto"; el.src = "/audio/cue?n=" + p.n + "&id=" + c.id + "&v=" + c.cv; pl = {el, cv:c.cv}; CUEP.set(c.id, pl); }
    const el = pl.el; el.volume = Math.max(0, Math.min(1, g));
    const want = t - c.t0, inside = want >= 0 && t < c.t1;
    if(playing && inside){
      if(el.paused){ if(Math.abs(el.currentTime - want) > 0.06){ try { el.currentTime = want; } catch(e){} } el.play().catch(()=>{}); }
      else if(Math.abs(el.currentTime - want) > 0.3){ try { el.currentTime = want; } catch(e){} }
    } else {
      if(!el.paused) el.pause();
      if(!inside && want < 0 && el.currentTime > 0.01){ try { el.currentTime = 0; } catch(e){} }   // впереди по ленте — встать на начало заранее
    }
  }
  for(const id of [...CUEP.keys()]) if(!live.has(id)) dropPlayer(id);
}

    for(const j of fin){ S.notes[j.rid] = 1; if(j.status === "error") toast("Фраза не озвучена: " + j.error, "red", 12000); else if(j.why && j.why.length) toast("Дубль готов, но движок сам заметил: " + j.why.join(", "), "red", 9000); }
    const act = j => j.status === "queued" || j.status === "running";
    if(fin.length || S.repoll || before.some(act) !== r.jobs.some(act)){ S.repoll = false; if(S.n && !(S.ed && S.ed.dirty)){ const n0 = S.n, a0 = S.act, p = await api("/api/part?n=" + n0); if(n0 === S.n && a0 === S.act && !S.posts && !(S.ed && S.ed.dirty)) setPart(p); else if(n0 === S.n) S.repoll = true; } else if(S.n) S.repoll = true; }
    else if(S.sel && r.jobs.some(j => j.uid === S.sel && act(j)) && !(S.ed && S.ed.dirty) && !S.free && document.activeElement.tagName !== "SELECT") drawInsp();
  } catch(e){ if(!S.down){ S.down = toast("Студия не отвечает. Запустите её ярлыком ещё раз — правки сохранены.", "red", 0); } return; }
  if(S.down){ S.down.remove(); S.down = null; }
}
function drawBanner(){
  const p = S.part, old = document.getElementById("expNote"); if(old) old.remove();
  if(p && p.export && !p.export.fresh){
    const d = toast("Готовая часть " + p.n + " устарела: после сборки были правки.", "red", 0, ["Собрать заново", exportPart]); d.id = "expNote";
  } else if(p && p.locked && !p.export){
    const d = toast("Часть " + p.n + " закреплена, но готового файла нет (сборка не удалась).", "red", 0, ["Собрать заново", exportPart]); d.id = "expNote";
  }
}

// ---------------------------------------------------------------- журнал: что делает студия и что с компьютером
const J = {last:0, rows:[], drawn:0, open:false, filter:"all", unseen:0, unseenLvl:"", sys:null, check:null, timer:0};
const JF = {all:e => true, imp:e => e.lvl === "warn" || e.lvl === "err", eng:e => e.src === "движок", edit:e => e.lvl === "edit", chk:e => e.src === "проверка"};
const gbs = mb => mb == null ? "?" : (mb >= 1000 ? (mb / 1024).toFixed(1) + " ГБ" : Math.round(mb) + " МБ");
function jRow(e){
  const d = document.createElement("div"); d.className = "je l-" + e.lvl + (e.more ? " more" : "");
  d.innerHTML = '<time class="num">' + esc(e.t) + '</time><span class="js">' + esc(e.src) + '</span><span class="jm">' + esc(e.msg) + '</span>';
  if(e.more) d.addEventListener("click", () => { const p = d.querySelector("pre"); if(p) p.remove(); else { const x = document.createElement("pre"); x.textContent = e.more; d.appendChild(x); } });
  return d;
}
function jDraw(all){                                            // all — перерисовать ленту целиком (сменился фильтр, открыли журнал)
  const L = $("#jlist"), f = JF[J.filter], stick = L.scrollHeight - L.scrollTop - L.clientHeight < 48;
  if(all){ L.textContent = ""; J.drawn = 0; }
  const none = document.getElementById("jEmpty"), fr = document.createDocumentFragment();
  let k = 0;
  for(let i = J.drawn; i < J.rows.length; i++) if(f(J.rows[i])){ fr.appendChild(jRow(J.rows[i])); k++; }
  J.drawn = J.rows.length;
  if(k && none) none.remove();
  L.appendChild(fr);
  while(L.childElementCount > 1500) L.firstElementChild.remove();
  if(!L.childElementCount){ const d = document.createElement("div"); d.className = "je"; d.id = "jEmpty"; d.innerHTML = '<time></time><span class="js"></span><span class="jm" style="color:var(--ink2)">Таких строк пока нет.</span>'; L.appendChild(d); }
  if(stick || all) L.scrollTop = L.scrollHeight;
}
function jSys(){
  const s = J.sys; if(!s) return;
  const g = s.gpu, vram = g && g.total ? '<i class="bar"><u style="width:' + Math.round(100 * g.used / g.total) + '%"></u></i> <b>' + (g.used / 1024).toFixed(1) + ' из ' + Math.round(g.total / 1024) + ' ГБ</b>' : "";
  $("#jsys").innerHTML = (vram ? '<span title="Занято видеопамяти. Движку озвучки нужно около 7 ГБ">Видеопамять ' + vram + '</span>' : "") + (s.cpu != null ? '<span>Процессор <b>' + s.cpu + ' %</b></span>' : "");
  let m = g ? '<span>Видеокарта <b>' + esc(g.name) + '</b></span>' + (vram ? '<span>видеопамять ' + vram + '</span>' : "") + (g.util != null ? '<span>загрузка карты <b>' + g.util + ' %</b></span>' : "") + (g.temp != null ? '<span class="' + (g.temp >= 85 ? "hot" : "") + '">нагрев <b>' + g.temp + ' °C</b></span>' : "")
            : '<span>Видеокарта <b>не найдена</b></span>';
  if(s.ram) m += '<span>память компьютера: свободно <b>' + gbs(s.ram.free) + '</b> из ' + gbs(s.ram.total) + '</span>';
  if(s.cpu != null) m += '<span>процессор <b>' + s.cpu + ' %</b>, ядер ' + s.cores + '</span>';
  if(s.disk) m += '<span class="' + (s.disk.free < 10240 ? "hot" : "") + '">диск ' + esc(s.disk.drive) + ' свободно <b>' + gbs(s.disk.free) + '</b></span>';
  if(s.cache) m += '<span>кэш студии <b>' + gbs(s.cache.mb) + '</b></span>';
  if(J.check) m += '<span>самопроверка: <b>' + (J.check.err ? "ошибок " + J.check.err : J.check.warn ? "замечаний " + J.check.warn : "всё на месте") + '</b></span>';
  $("#jmeters").innerHTML = m;
  const o = s.ops && s.ops[s.ops.length - 1], op = $("#jop"), ls = $("#loadSub");
  let text = "";
  if(o){
    const pc = o.total ? Math.min(100, Math.round(100 * o.done / o.total)) : null, b = op.querySelector(".bar");
    text = o.what + (o.stage ? ": " + o.stage : "") + (o.total ? " — " + Math.min(o.done, o.total) + " из " + o.total : "") + (o.sec >= 3 ? ", " + Math.round(o.sec) + " с" : "");
    $("#jopt").textContent = text; b.classList.toggle("run", pc === null); b.firstElementChild.style.width = pc === null ? "" : pc + "%";
  }
  op.hidden = !o; ls.textContent = text;
}
function jBadge(){ const b = $("#jbadge"); b.hidden = !J.unseen; b.textContent = J.unseen; b.className = J.unseenLvl === "err" ? "" : "warn"; b.title = "Новых замечаний и сбоев: " + J.unseen; }
function jLayout(){ document.documentElement.style.setProperty("--jb", $("#jr").offsetHeight + "px"); }
async function pollLog(){
  clearTimeout(J.timer);
  try {
    const r = await api("/api/log?after=" + J.last + (J.open ? "&open=1" : ""));
    if(r.last < J.last){ J.rows = []; J.drawn = 0; $("#jlist").textContent = ""; }      // студию перезапустили — её журнал начался заново
    J.last = r.last; J.sys = r.sys; J.check = r.check;
    if(r.ev.length){
      J.rows.push(...r.ev);
      const imp = r.ev.filter(JF.imp);
      if(!J.open && imp.length){ J.unseen += imp.length; if(imp.some(e => e.lvl === "err")) J.unseenLvl = "err"; }
      const le = [...r.ev].reverse().find(e => e.lvl !== "eng") || r.ev[r.ev.length - 1], jl = $("#jlast");
      jl.textContent = le.t + "  " + le.msg; jl.className = le.lvl === "err" ? "err" : le.lvl === "warn" ? "warn" : ""; jl.title = le.msg;
      if(J.rows.length > 4000){ J.rows.splice(0, J.rows.length - 3000); if(J.open) jDraw(true); else J.drawn = 0; }
      else if(J.open) jDraw(false);
    }
    jBadge(); jSys();
    if(r.engine){ S.engine = r.engine; drawEngine(); }
    if(r.go){ const was = S.go && S.go.running; S.go = r.go; drawGo();
      if(was && !r.go.running){ loadState().then(() => { const d = S.parts.find(x => !x.opened); if(d) toast("Часть " + d.n + " озвучена и собрана.", "ok", 0, ["Открыть её", () => openPart(d.n)]); }).catch(()=>{}); } }
    if(J.auto && J.open && S.engine.ready && !J.autoT) J.autoT = setTimeout(() => { J.autoT = 0; if(J.auto && J.open) jOpen(false); J.auto = false; }, 6000);
  } catch(e){}
  const busy = J.sys && J.sys.ops && J.sys.ops.length;
  J.timer = setTimeout(pollLog, busy || !$("#load").hidden ? 600 : (J.open ? 1500 : 4000));
}
function jOpen(on){
  if(on === undefined) J.auto = false;                          // свернул или раскрыл сам автор
  J.open = on === undefined ? !J.open : !!on;
  $("#jr").classList.toggle("open", J.open); $("#jbody").hidden = !J.open; $("#jgrip").hidden = !J.open; $("#jtog").setAttribute("aria-expanded", String(J.open));
  if(J.open){ J.unseen = 0; J.unseenLvl = ""; jBadge(); jDraw(true); }
  try { localStorage.setItem("nox.journal", J.open ? "1" : "0"); } catch(e){}
  jLayout(); draw(); pollLog();
}
function jFilter(name){ J.filter = name; for(const x of document.querySelectorAll("[data-jf]")) x.classList.toggle("on", x.dataset.jf === name); jDraw(true); }
async function openDir(what, path){ try { const r = await api("/api/open", {what, path:path || ""}); if(!r.opened) toast("Папка: " + r.path, "", 9000); } catch(e){ fail(e); } }

$("#jr").addEventListener("mousedown", () => { J.auto = false; }, true);          // автор сам занялся журналом — пусть остаётся открытым
for(const b of document.querySelectorAll("[data-jf]")) b.addEventListener("click", () => jFilter(b.dataset.jf));

  if(e.key === "F1"){ e.preventDefault(); if($("#veil").hidden) helpDialog(); return; }
  if((e.ctrlKey || e.metaKey) && !e.altKey && (e.code === "KeyS" || e.code === "KeyO" || e.code === "KeyE")){
    e.preventDefault();                                        // иначе браузер откроет свои «Сохранить страницу» и «Открыть файл»
    if(e.repeat || !$("#veil").hidden || !S.part) return;
    if(e.code === "KeyO") projectDialog(); else if(e.code === "KeyE") textDialog(); else projectSave(false, "");
    return;
  }
  if(!$("#veil").hidden){ if(e.key === "Escape") closeDialog(); return; }
  const tag = (e.target.tagName || "").toLowerCase(), typing = tag === "textarea" || tag === "select" || (tag === "input" && e.target.type !== "range" && e.target.type !== "radio");
  if(e.key === "Escape" && !typing && S.cue && !S.sel){ S.cue = null; drawInsp(); draw(); return; }
  if((e.key === "Delete" || e.key === "Backspace") && !typing && S.cue && !S.sel){ e.preventDefault(); cueDel(S.cue); return; }
  if(e.key === "Escape"){ if(typing) e.target.blur(); else if(S.sel){ (S.ed && S.ed.dirty ? saveEd() : Promise.resolve()).then(() => { S.sel = null; S.ed = null; markSel(); drawInsp(); draw(); }); } return; }
  if(typing || !S.part) return;
  if(e.ctrlKey && (e.key === "z" || e.key === "я" || e.code === "KeyZ")){ e.preventDefault(); api("/api/undo", {part:S.n}).then(r => { S.ed = null; if(r.part) setPart(r.part); toast("Отменено"); if(r.uid === "#cues") loadState(); }).catch(fail); return; }
  if(e.ctrlKey || e.altKey || e.metaKey) return;
  const k = e.code, sel = S.sel ? segOf(S.sel) : null;
  if(k === "Space"){ e.preventDefault(); togglePlay(); }
  else if(k === "ArrowLeft"){ e.preventDefault(); seekTo((au.currentTime || 0) - (e.shiftKey ? 30 : 5)); }
  else if(k === "ArrowRight"){ e.preventDefault(); seekTo((au.currentTime || 0) + (e.shiftKey ? 30 : 5)); }
  else if(k === "ArrowUp"){ e.preventDefault(); step(-1); }
  else if(k === "ArrowDown"){ e.preventDefault(); step(1); }
  else if(k === "Enter"){ if(tag === "button") return; e.preventDefault(); if(S.sel) playPhrase(S.sel); }
  else if(k === "KeyC"){ if(S.sel) playContext(S.sel); }
  else if(k === "KeyM"){ markNow(); }
  else if(k === "BracketLeft"){ gotoAtt(-1); }
  else if(k === "BracketRight"){ gotoAtt(1); }
  else if(k === "KeyR"){ if(e.shiftKey) synthAll(); else if(S.sel) synth(S.sel); }
  else if(k === "KeyL"){ if(S.sel) toggleLock(S.sel); }
  else if(k === "KeyJ"){ jOpen(); }
  else if(k === "Insert" || k === "KeyI"){ e.preventDefault(); const u = S.sel || (nowSeg() || {}).uid; if(u) insertDialog(u); }
  else if(k === "KeyU"){ if(S.sel) ownRecord(S.sel); else toast("Сначала выберите фразу, которой даёте свою запись."); }
  else if(k === "KeyT"){ e.preventDefault(); if(S.sel){ const c = sel.takes.find(x => x.chosen); trimDialog(S.sel, c ? c.tid : ""); } }
  else if(k === "KeyE"){ e.preventDefault(); if(sel && !sel.locked && $("#freeBtn")) $("#freeBtn").click(); }
  else if(k === "F2"){ e.preventDefault(); if(sel && sel.ins) insertEditDialog(S.sel); else if(sel && !sel.locked && $("#freeBtn")) $("#freeBtn").click(); }
  else if(k === "Delete"){ if(sel && sel.ins){ e.preventDefault(); insertDelete(S.sel); } }
  else if(k === "KeyG"){ e.preventDefault(); voicesDialog(true); }
  else if(k === "KeyS"){ e.preventDefault(); if(!sel) toast("Сначала выберите фразу, которую соединяете со следующей."); else if(e.shiftKey) unjoin(S.sel); else joinNext(S.sel); }
  else if(k === "KeyD"){ e.preventDefault(); if(sel && !sel.locked){ setSeg(S.sel, {after: sel.after ? 0 : 0.5}); toast(sel.after ? "Пауза после фразы убрана." : "После фразы — пауза 0,5 с. Точное значение — в поле справа."); } }
  else if(k === "KeyF"){ e.preventDefault(); if(sel && !sel.locked && $("#roleFind")) roleFind(sel); }
  else if(k === "KeyP"){ e.preventDefault(); $("#btnParts").click(); }
  else if(k === "PageUp"){ e.preventDefault(); if(S.n > 1) openPart(S.n - 1); }
  else if(k === "PageDown"){ e.preventDefault(); if(S.n < S.parts.length) openPart(S.n + 1); }
  else if(k === "Home" || k === "End"){ e.preventDefault(); const a = S.part.segs, x = a[k === "Home" ? 0 : a.length - 1]; if(x) select(x.uid, true).then(() => reveal(x.uid, true)); }
  else if(/^(Digit|Numpad)[0-9]$/.test(k)){
    if(sel && !sel.locked){ const d = +k.slice(-1);
      if(d === 0){ if(sel.draft && sel.takes.some(x => x.chosen)) chooseTake(S.sel, null); }
      else if(sel.takes[d - 1] && !sel.takes[d - 1].chosen) chooseTake(S.sel, sel.takes[d - 1].tid); }
  }
});
document.addEventListener("keyup", e => { if(e.code === "Space" && (e.target.tagName || "").toLowerCase() === "button") e.preventDefault(); });
window.addEventListener("beforeunload", () => {
  const hd = {"Content-Type":"application/json","X-Nox-Token":TOKEN};
  try { commitFree();                                         // несохранённая правка текста уходит на сервер и при закрытии окна
        if(S.ed && S.ed.dirty){ const s = segOf(S.ed.uid); if(s && !s.locked) fetch("/api/seg", {method:"POST", keepalive:true, headers:hd, body:JSON.stringify({uid:S.ed.uid, set:{role:S.ed.role, tech:edText()}})}); } } catch(e){}
  try { fetch("/api/bye", {method:"POST", keepalive:true, headers:hd, body:"{}"}); } catch(e){}
});

// ---------------------------------------------------------------- пуск
(async function(){
  try { const t = localStorage.getItem("nox.theme"); if(t) document.documentElement.dataset.theme = t; const z = +localStorage.getItem("nox.zoom"); if(z) S.zoom = z; } catch(e){}
  drawPlay();
  try {
    await loadState();
    if(!S.parts.length){ $("#load").innerHTML = "Собранных частей пока нет.<br>Студия открывается, когда конвейер озвучил и собрал хотя бы первую часть."; return; }
    let n = 0; try { n = +localStorage.getItem("nox.part:" + S.book.root) || 0; } catch(e){}
    if(!(n >= 1 && n <= S.parts.length)) n = (S.parts.find(p => !p.locked) || S.parts[0]).n;
    await openPart(n);
  } catch(e){ $("#load").textContent = e.message; return; }
  loop();
  try { const h = +localStorage.getItem("nox.jh"); if(h >= 120) document.documentElement.style.setProperty("--jh", h + "px"); if(localStorage.getItem("nox.journal") === "1") jOpen(true); } catch(e){}
  jLayout(); pollLog();
  setInterval(pollJobs, 1000);
  setInterval(async () => { if(S.n && au.paused && !(S.ed && S.ed.dirty) && !S.free && $("#veil").hidden && document.activeElement.tagName !== "SELECT"){ try { if(S.posts) return; const a0 = S.act, n0 = S.n, p = await api("/api/part?n=" + n0);
          if(S.posts || a0 !== S.act || n0 !== S.n || !S.part) return;     // пока ждали ответа, сам автор что-то сделал — этот ответ уже не про то
          if(p.ver !== S.part.ver){ setPart(p); toast("Запись обновилась: конвейер переозвучил фразу в этой части.", "blue"); } } catch(e){} } }, 30000);
})();
</script>
